<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CPRF Network Attack Detector">
  <title>CPRF Network Attack Detector</title>
  <style>
    /* Brighter tile in dark mode so the mark stays vivid on dark browser chrome. */
    @media (prefers-color-scheme: dark) {
      #tile-top { stop-color: #60a5fa; }
      #tile-bottom { stop-color: #2563eb; }
      #pulse { stroke: #1e3a8a; }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop id="tile-top" offset="0" stop-color="#3b82f6" />
      <stop id="tile-bottom" offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect width="64" height="64" rx="14" fill="url(#tile)" />

  <!-- Shield -->
  <path
    d="M32 11.5 49.5 18.2v13.3c0 10.3-7.3 17.8-17.5 21.5-10.2-3.7-17.5-11.2-17.5-21.5V18.2Z"
    fill="#ffffff"
  />

  <!-- Traffic pulse inside the shield -->
  <path
    id="pulse"
    d="M20.5 32.5h5.2l3.1-7.4 4.6 14.6 3.5-9.3 2.3 4.6h4.8"
    fill="none"
    stroke="#1d4ed8"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
